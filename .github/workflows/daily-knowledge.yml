name: daily-knowledge

on:
  schedule:
    # GitHub Actions 的 cron 按 UTC；00:00 UTC = 08:00 UTC+8
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖当天日报（重新采集并渲染）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 单一并发组：定时与手动触发不重叠
  group: daily-knowledge
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
      skip: ${{ steps.guard.outputs.skip }}

    steps:
      - name: 检出
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 计算 UTC+8 日期
        id: date
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 幂等检查
        id: guard
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "force=true：按重新采集并覆盖执行。" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "daily-knowledge/$DATE.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "daily-knowledge/$DATE.md 已存在，force=false，跳过。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  daily:
    needs: guard
    if: needs.guard.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      OPENCODE_DISABLE_AUTOUPDATE: "1"

    steps:
      - name: 检出
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: 准备当日工作区
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
          DATE: ${{ needs.guard.outputs.date }}
        run: |
          if [ "$FORCE" = "true" ]; then
            # CI 无头：直接清理工作区当日产物，避免代理等待「三选一」。
            # 保留 tokens.json，token 历史不丢。
            rm -f "daily-knowledge/$DATE.md"
            rm -f "work/$DATE/collect.json" \
                  "work/$DATE/analyze.json" \
                  "work/$DATE/organize.json" \
                  "work/$DATE/score.json"
          fi

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 安装 Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: 同步 Python 依赖
        run: uv sync --frozen

      - name: 单元测试（先于模型调用）
        run: uv run python -m unittest discover -s tests -t .

      - name: 安装锁定版本 opencode
        shell: bash
        run: |
          npm install -g @opencode/cli@2.0.26 --no-fund --no-audit
          opencode --version

      - name: 无头运行知识采集
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OC_GO_API_KEY: ${{ secrets.OC_GO_API_KEY }}
        run: |
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          : "${OC_GO_API_KEY:?OC_GO_API_KEY is required}"
          opencode run --standalone --auto \
            --model oc-go/deepseek-v4.1-flash \
            --agent build \
            "开始今天的知识采集"

      - name: 校验产物
        shell: bash
        env:
          DATE: ${{ needs.guard.outputs.date }}
        run: |
          uv run python scripts/validate.py --date "$DATE"
          test -s "daily-knowledge/$DATE.md"
          test -s "daily-knowledge/tokens/$DATE.md"

      - name: 提交回写
        shell: bash
        env:
          DATE: ${{ needs.guard.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 只发布日报、token 报告与当日采集产物
          git add "daily-knowledge" "work/$DATE/collect.json"

          if git diff --cached --quiet; then
            echo "无变更，跳过提交。"
            exit 0
          fi

          git commit -m "chore: daily knowledge $DATE"

          # 并发组已挡住重叠；仍处理运行期间他人推送的情况
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 失败时上传 work 现场
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: work-${{ needs.guard.outputs.date || github.run_id }}-${{ github.run_attempt }}
          path: work/${{ needs.guard.outputs.date }}/
          if-no-files-found: warn
          retention-days: 7
